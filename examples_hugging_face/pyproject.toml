[tool.setuptools]
packages = ["grand_tour"]
package-dir = { "" = "src" }

[tool.uv]
package = true

[project]
name = "grand_tour"
version = "0.1.0"
description = "GrandTour HuggingFace Integration"
authors = []
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "huggingface_hub",
    "tqdm",
]


[project.optional-dependencies]
lidar = [
    "matplotlib",
    "opencv-python",
    "pillow",
    "plotly",
    "scipy",
    "transformers",
    "zarr==3.0.8",
]
all = [
    "grand_tour[lidar]",
    "shapely",
    "open3d",
    "trimesh",
    "notebook",
    "rich",
    "torch",
    "torchvision",
    "IPython",
    "imageio",
    "cupy-cuda12x",
    "ruamel.yaml",
    "scikit-image",
    "simple-parsing",
    "networkx",
    "elevation-mapping-cupy @ git+https://github.com/leggedrobotics/elevation_mapping_cupy@0195d20ef33bb48a49dcf1107fc1b4c6f56ad19b"
]

[dependency-groups]
dev = [
    "ruff>=0.5",   # linting
    "black>=24.0", # code formatting
]
